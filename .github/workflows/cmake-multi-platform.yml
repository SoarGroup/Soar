name: CMake on multiple platforms

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]
  workflow_dispatch:
  release:
    types:
      - prereleased
      - released
  schedule:
    # 5AM every Monday, to catch breaks due to changes in dependencies
    - cron: "0 5 * * 1"

jobs:
  build-nix:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-22.04, macos-latest]
        build_type: [Release, Debug]
        build_shared_libs: [ON, OFF]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install Conan
        run: pip install conan

      - name: Configure Conan
        run: |
          conan profile detect

      - name: Install SWIG (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install swig

      - name: Install dependencies
        run: |
          conan install . --build=missing -s build_type=Release
          conan install . --build=missing -s build_type=Debug

      # Usage of cmake workflow feature prevents passing options via -D thereby
      # creating a lot of duplicated code in the CMakePresets.txt. For this
      # reason, we use the cmake --preset command.
      - name: Configure CMake
        run: >
          cmake --preset ${{ matrix.build_type }}-${{ matrix.build_shared_libs == 'ON' && 'shared' || 'test' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }}-${{ matrix.build_shared_libs == 'ON' && 'shared' || 'test' }}

      - name: Test
        run: ctest --preset ${{ matrix.build_type }}-${{ matrix.build_shared_libs == 'ON' && 'shared' || 'test' }}

      - name: Package
        if: ${{ matrix.build_type == 'Release' &&  (github.event_name == 'release' || github.event_name == 'workflow_dispatch')  }}
        run: |
          cpack --preset ${{ matrix.build_type }}-${{ matrix.build_shared_libs == 'ON' && 'shared' || 'test' }}

      # Packages are put in the current working directory to prevent path
      # incompatibilities between Windows and Linux/Mac
      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        if: ${{ matrix.build_type == 'Release' &&  (github.event_name == 'release' || github.event_name == 'workflow_dispatch')  }}
        with:
          name: ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.build_shared_libs == 'ON' && 'shared' || 'static' }}.tar.gz
          path: |
            soar-*.tar.gz
      - name: Upload Debian
        uses: actions/upload-artifact@v4
        if: ${{ matrix.build_type == 'Release' &&  (matrix.os == 'ubuntu-22.04') && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')  }}
        with:
          name: ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.build_shared_libs == 'ON' && 'shared' || 'static' }}.deb
          path: |
            soar-*.deb

  build-svs:
    # Runs the Release-svs-test preset, which enables SVS=ON and adds the
    # test_svs ctest entry on top of the usual test_ci. The build-nix and
    # build-windows matrices have SVS=OFF in every preset, so without this job
    # SVS gets no CI coverage.
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install Conan
        run: pip install conan

      - name: Install Ninja (Windows)
        if: matrix.os == 'windows-latest'
        run: pip install ninja

      - name: Configure Conan
        run: conan profile detect

      - name: Install dependencies (Unix)
        if: matrix.os != 'windows-latest'
        run: conan install . --build=missing -s build_type=Release

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: conan install . --build=missing -s build_type=Release -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure CMake
        run: cmake --preset Release-svs-test

      - name: Build
        run: cmake --build --preset Release-svs-test

      - name: Test
        run: ctest --preset Release-svs-test

  build-swig:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Conan and Ninja
        run: pip install conan ninja

      - name: Configure Conan
        run: conan profile detect

      - name: Install SWIG (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: pip install swig

      - name: Install SWIG (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install swig

      - name: Install SWIG (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install swig -y

      - name: Install Tcl dev headers (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y tcl-dev

      - name: Install Tcl dev headers (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install tcl-tk@8

      - name: Install dependencies (Unix)
        if: matrix.os != 'windows-latest'
        run: conan install . --build=missing -s build_type=Release

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: conan install . --build=missing -s build_type=Release -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Create Python stable ABI import library (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $pythonLib = Join-Path $env:pythonLocation "libs\python3.lib"
          if (!(Test-Path $pythonLib)) {
            $pythonDll = @(
              (Join-Path $env:pythonLocation "python3.dll"),
              (Join-Path $env:pythonLocation "DLLs\python3.dll")
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (!$pythonDll) {
              throw "Could not find python3.dll under $env:pythonLocation"
            }

            $defFile = Join-Path $env:RUNNER_TEMP "python3.def"
            $exports = dumpbin /nologo /exports $pythonDll |
              ForEach-Object {
                if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)$') {
                  "    $($matches[1])"
                }
              }
            @("LIBRARY python3.dll", "EXPORTS") + $exports | Set-Content $defFile
            New-Item -ItemType Directory -Force (Split-Path $pythonLib) | Out-Null
            # This job runs on windows-latest, which is x64.
            lib /nologo /def:$defFile /machine:x64 /out:$pythonLib
          }

      - name: Configure CMake (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: cmake --preset Release-swig

      - name: Configure CMake (macOS — brew Tcl is keg-only)
        if: matrix.os == 'macos-latest'
        run: cmake --preset Release-swig -DCMAKE_PREFIX_PATH=$(brew --prefix tcl-tk@8)

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        # magicsplat-tcl-tk doesn't ship find_package-friendly TCL_LIBRARY /
        # TCL_INCLUDE_PATH. Building Tcl from source is handled in release.yml
        # (which produces the actual shipped zip); for this fast PR-time CI we
        # exercise the other SWIG bindings and skip Tcl on Windows.
        run: cmake --preset Release-swig -DSWIG_TCL=OFF -DTCLSOARLIB=OFF

      - name: Build
        run: cmake --build --preset Release-swig

      - name: Verify SWIG artifacts
        shell: bash
        run: |
          echo "=== Checking SWIG artifacts ==="
          find . -name "sml.jar" -o -name "*sml_ClientInterface*" -o -name "soar-debugger*.jar" -o -name "soar-smljava.jar" -o -name "SoarJavaDebugger.jar" | head -20
          echo "=== Done ==="

      - name: Upload SWIG artifacts
        uses: actions/upload-artifact@v4
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          name: swig-${{ matrix.os }}
          path: |
            build/**/java/*.jar
            build/**/SoarJavaDebugger.jar
            build/**/*sml_ClientInterface*
            build/**/pkgIndex.tcl

  build-windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false

      matrix:
        build_type: [Release, Debug]
        build_shared_libs: [ON, OFF]

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install Conan and Ninja
        run: pip install conan ninja

      - name: Configure Conan
        run: conan profile detect

      - name: Install dependencies
        run: |
          conan install . --build=missing -s build_type=Release -c tools.cmake.cmaketoolchain:generator=Ninja
          conan install . --build=missing -s build_type=Debug -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure CMake
        run: >
          cmake --preset ${{ matrix.build_type }}-${{ matrix.build_shared_libs == 'ON' && 'shared' || 'test' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }}-${{ matrix.build_shared_libs == 'ON' && 'shared' || 'test' }}

      - name: Test
        run: ctest --preset ${{ matrix.build_type }}-${{ matrix.build_shared_libs == 'ON' && 'shared' || 'test' }}

      - name: Package
        if: ${{ matrix.build_type == 'Release' &&  (github.event_name == 'release' || github.event_name == 'workflow_dispatch')  }}
        run: |
          cpack --preset ${{ matrix.build_type }}-${{ matrix.build_shared_libs == 'ON' && 'shared' || 'test' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ matrix.build_type == 'Release' &&  (github.event_name == 'release' || github.event_name == 'workflow_dispatch')  }}
        with:
          name: windows-${{ matrix.build_type }}-${{ matrix.build_shared_libs == 'ON' && 'shared' || 'static' }}.zip
          path: |
            soar-*.zip
